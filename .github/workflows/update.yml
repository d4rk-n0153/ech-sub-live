name: update-subscription

on:
  schedule:
    # هر ۴ ساعت — کلید ECH دوره‌ای عوض می‌شود
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch ECH and rewrite subscription
        run: node update.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscription.txt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh ECH $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
